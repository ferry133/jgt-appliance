---
# Flux entry point for this per-user cluster.
# Defines the jg-base GitRepository and all Kustomizations.
# Generated by task configure from cluster.yaml.

# ── cluster-secrets — SOPS-decrypted from per-user repo ──────────────────────
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  decryption:
    provider: sops
  interval: 1h
  path: ./kubernetes/components/sops
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# ── GitRepository — points to jg-base ────────────────────────────────────────
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: jg-base
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/ferry133/jg-base
  ref:
    branch: main
---
# ── Base Kustomization — installed on every cluster ───────────────────────────
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-base
  namespace: flux-system
spec:
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: jg-base
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  wait: false
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
          deletionPolicy: WaitForTermination
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    # suspended: storage_backend is local-path, so there is no NAS to provision from
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: nfs-client-provisioner
          namespace: flux-system
        spec:
          suspend: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: nfs-client-provisioner
    # suspended: storage_backend is local-path; replicated storage also needs Talos system extensions on every node
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: longhorn
          namespace: flux-system
        spec:
          suspend: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: longhorn
    # suspended: single-node cluster: a peer-to-peer image mirror has no peers
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: spegel
          namespace: flux-system
        spec:
          suspend: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: spegel
    # appliance: envoy-external always allocates from the probed pool
    - patch: |-
        - op: add
          path: /spec/patches/-
          value:
            patch: |-
              - op: remove
                path: /spec/infrastructure/annotations/lbipam.cilium.io~1ips
            target:
              group: gateway.networking.k8s.io
              kind: Gateway
              name: envoy-external
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: envoy-gateway
    # appliance, shared address not yet pinned: allocate it from the pool too
    - patch: |-
        - op: add
          path: /spec/patches/-
          value:
            patch: |-
              - op: remove
                path: /spec/infrastructure/annotations/lbipam.cilium.io~1ips
            target:
              group: gateway.networking.k8s.io
              kind: Gateway
              name: envoy-internal
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: envoy-gateway
    - patch: |-
        - op: add
          path: /spec/patches/-
          value:
            patch: |-
              - op: remove
                path: /spec/values/service/annotations/lbipam.cilium.io~1ips
            target:
              group: helm.toolkit.fluxcd.io
              kind: HelmRelease
              name: k8s-gateway
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: k8s-gateway
---
# ── claude-code instances (base; per-cluster rendered from claude_instances) ──
# The shared pieces (namespace, SA/RBAC, OCIRepository, secrets) come from
# apps/base/claudecode in jg-base; only the per-instance HelmReleases are
# rendered here, because instance names and the optional oauth2-proxy /
# talos-mcp sidecars are template-time structure, not Flux values.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-code-instances
  namespace: flux-system
spec:
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps/base/claudecode/claude-code/instances
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  dependsOn:
    - name: cluster-apps-base
